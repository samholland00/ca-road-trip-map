<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>California Road Trip</title>

    <!-- Leaflet + Leaflet.markercluster, vendored locally (no CDN) -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css" />
    <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>

    <div id="title-card">
      <h1>California Road Trip</h1>
      <p id="trip-meta">Loading photos…</p>
    </div>

    <div id="message" hidden></div>

    <div id="carousel" hidden>
      <button id="cz-close" class="cz-btn" type="button" aria-label="Close">✕</button>
      <button id="cz-prev" class="cz-btn cz-nav" type="button" aria-label="Previous photo">‹</button>
      <figure id="cz-figure">
        <img id="cz-img" alt="" />
        <figcaption id="cz-cap"></figcaption>
      </figure>
      <button id="cz-next" class="cz-btn cz-nav" type="button" aria-label="Next photo">›</button>
    </div>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/markercluster/leaflet.markercluster.js"></script>
    <script src="vendor/polylinedecorator/leaflet.polylineDecorator.js"></script>
    <script src="app.js"></script>
  </body>
</html>
